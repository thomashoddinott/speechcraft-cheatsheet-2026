<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QR sheet</title>
  <style>
    @page { size: A4; margin: 0; }
    html, body { margin: 0; }

    .sheet {
      box-sizing: border-box;
      width: 210mm;
      height: 297mm;
      padding: 10mm;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.2mm dashed #ccc; /* cut guides */
    }

    .cell img {
      width: 52mm;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
    <div class="cell"><img src="qr-with-slogan.svg" alt=""></div>
  </div>
</body>
</html>
